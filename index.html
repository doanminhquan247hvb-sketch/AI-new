    <script>
      // Safeguard against iframe / sandbox wrappers setting window.fetch when it has only a getter
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return _fetch; },
                set: function(val) { _fetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          // Ignore if environment forbids descriptor redefinition
        }
      })();
    </script>
